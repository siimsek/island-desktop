<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Island2 screen-edge glow: same element names/transforms as Breeze's widgets/glowbar,
     but 56px thick with an eased multi-stop falloff for a soft, blurred look. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="168" height="180" viewBox="0 0 168 180" id="svg1" version="1.1">
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Highlight {
        color:#89b4fa;
    }
  </style>
  <defs>
    <linearGradient id="line">
      <stop offset="0" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0.8" />
      <stop offset="0.12" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0.62" />
      <stop offset="0.25" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0.44" />
      <stop offset="0.4" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0.27" />
      <stop offset="0.55" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0.15" />
      <stop offset="0.7" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0.07" />
      <stop offset="0.85" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0.02" />
      <stop offset="1" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="rad" cx="0" cy="0" r="1" xlink:href="#line" />
  </defs>
  <rect id="hint-glow-radius" width="5" height="5" x="0" y="0" style="fill:#ff6600" />
  <rect id="hint-tile-center" width="5" height="5" x="0" y="6" style="fill:#ff6600" />
  <g transform="translate(0,12)">
    <g id="top" transform="translate(56,0)"><rect style="fill:url(#line)" height="56" width="56" transform="rotate(-90 28.0 28.0)" /></g>
    <g id="left" transform="translate(0,56)"><rect style="fill:url(#line)" height="56" width="56" transform="rotate(180 28.0 28.0)" /></g>
    <g id="right" transform="translate(112,56)"><rect style="fill:url(#line)" height="56" width="56" /></g>
    <g id="bottom" transform="translate(56,112)"><rect style="fill:url(#line)" height="56" width="56" transform="rotate(90 28.0 28.0)" /></g>
    <g transform="translate(56,56)" id="center"><rect height="56" width="56" class="ColorScheme-Highlight" style="fill:currentColor;fill-opacity:0.80" /></g>
    <g id="topright" transform="translate(112,0)"><rect style="fill:url(#rad)" height="56" width="56" transform="rotate(-90 28.0 28.0)" /></g>
    <g id="bottomright" transform="translate(112,112)"><rect style="fill:url(#rad)" height="56" width="56" /></g>
    <g id="bottomleft" transform="translate(0,112)"><rect style="fill:url(#rad)" height="56" width="56" transform="rotate(90 28.0 28.0)" /></g>
    <g id="topleft" transform="translate(0,0)"><rect style="fill:url(#rad)" height="56" width="56" transform="rotate(180 28.0 28.0)" /></g>
  </g>
</svg>
