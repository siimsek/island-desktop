<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Island2 screen-edge glow: same element names/transforms as Breeze's widgets/glowbar,
     but 28px thick with an eased multi-stop falloff for a soft, blurred look. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="84" height="96" viewBox="0 0 84 96" id="svg1" version="1.1">
  <style id="current-color-scheme" type="text/css">
    .ColorScheme-Highlight {
        color:#89b4fa;
    }
  </style>
  <defs>
    <linearGradient id="line">
      <stop offset="0" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0.7" />
      <stop offset="0.12" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0.52" />
      <stop offset="0.25" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0.36" />
      <stop offset="0.4" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0.21" />
      <stop offset="0.55" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0.11" />
      <stop offset="0.7" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0.05" />
      <stop offset="0.85" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0.015" />
      <stop offset="1" class="ColorScheme-Highlight" style="stop-color:currentColor;stop-opacity:0" />
    </linearGradient>
    <radialGradient id="rad" cx="0" cy="0" r="1" xlink:href="#line" />
  </defs>
  <rect id="hint-glow-radius" width="5" height="5" x="0" y="0" style="fill:#ff6600" />
  <rect id="hint-tile-center" width="5" height="5" x="0" y="6" style="fill:#ff6600" />
  <g transform="translate(0,12)">
    <g id="top" transform="translate(28,0)"><rect style="fill:url(#line)" height="28" width="28" transform="rotate(-90 14.0 14.0)" /></g>
    <g id="left" transform="translate(0,28)"><rect style="fill:url(#line)" height="28" width="28" transform="rotate(180 14.0 14.0)" /></g>
    <g id="right" transform="translate(56,28)"><rect style="fill:url(#line)" height="28" width="28" /></g>
    <g id="bottom" transform="translate(28,56)"><rect style="fill:url(#line)" height="28" width="28" transform="rotate(90 14.0 14.0)" /></g>
    <g transform="translate(28,28)" id="center"><rect height="28" width="28" class="ColorScheme-Highlight" style="fill:currentColor;fill-opacity:0.70" /></g>
    <g id="topright" transform="translate(56,0)"><rect style="fill:url(#rad)" height="28" width="28" transform="rotate(-90 14.0 14.0)" /></g>
    <g id="bottomright" transform="translate(56,56)"><rect style="fill:url(#rad)" height="28" width="28" /></g>
    <g id="bottomleft" transform="translate(0,56)"><rect style="fill:url(#rad)" height="28" width="28" transform="rotate(90 14.0 14.0)" /></g>
    <g id="topleft" transform="translate(0,0)"><rect style="fill:url(#rad)" height="28" width="28" transform="rotate(180 14.0 14.0)" /></g>
  </g>
</svg>
